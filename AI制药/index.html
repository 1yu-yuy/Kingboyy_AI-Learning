<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI制药学习路线 · 12周</title>
<style>
:root {
  --bg:#0b0f15; --card:#131822; --border:#1e2a3a; --text:#e2e8f0;
  --dim:#7c879c; --teal:#2dd4bf; --purple:#a78bfa; --blue:#60a5fa;
  --green:#4ade80; --orange:#fb923c; --pink:#f472b6; --yell:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
a{color:var(--blue)}

/* ===== HEADER ===== */
.header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;
}
.header .logo{font-size:1.1rem;font-weight:800;white-space:nowrap}
.header .logo span{background:linear-gradient(135deg,var(--teal),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .stat{font-size:.76rem;color:var(--dim)}
.header .stat b{color:var(--text)}
.header .streak{color:var(--orange)}

/* ===== ROADMAP ===== */
.roadmap-wrap{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 20px;overflow-x:auto;
}
.roadmap-label{font-size:.72rem;color:var(--dim);margin-bottom:10px;font-weight:700;letter-spacing:.04em}
.roadmap{display:flex;gap:0;min-width:860px}
.phase-col{flex:1;padding:0 10px;border-right:1px solid var(--border);text-align:center}
.phase-col:last-child{border-right:none}
.phase-title{font-size:.68rem;font-weight:700;margin-bottom:8px;white-space:nowrap}
.ph1{color:var(--blue)}.ph2{color:var(--purple)}.ph3{color:var(--pink)}.ph4{color:var(--teal)}
.week-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wk-btn{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--border);
  background:var(--bg);color:var(--dim);display:flex;align-items:center;
  justify-content:center;font-size:.78rem;font-weight:700;cursor:pointer;
  transition:all .2s;position:relative;user-select:none;
}
.wk-btn:hover{border-color:var(--teal);color:var(--text);transform:scale(1.12);box-shadow:0 0 16px rgba(45,212,191,.2)}
.wk-btn.current{border-color:var(--teal);color:var(--teal);box-shadow:0 0 16px rgba(45,212,191,.3);border-width:3px}
.wk-btn.done{background:var(--green);border-color:var(--green);color:#000}
.wk-btn .tag{
  position:absolute;top:-8px;right:-12px;font-size:.55rem;
  background:var(--orange);color:#000;padding:1px 5px;border-radius:6px;
  font-weight:700;display:none;
}
.wk-btn.current .tag{display:block}

/* ===== NAV ROW ===== */
.nav-row{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.nav-btn{
  padding:8px 18px;border-radius:18px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;
  font-size:.82rem;font-weight:600;transition:all .2s;font-family:inherit;
}
.nav-btn:hover{background:var(--teal);color:#000;border-color:var(--teal)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn:disabled:hover{background:var(--card);color:var(--text);border-color:var(--border)}
.nav-btn.today-btn{border-color:var(--orange);color:var(--orange);margin-left:auto}
.nav-btn.today-btn:hover{background:var(--orange);color:#000;border-color:var(--orange)}
.nav-info{font-weight:700;font-size:.95rem;min-width:120px;text-align:center}

/* ===== MAIN ===== */
.main{max-width:900px;margin:0 auto;padding:20px}

.week-header{margin-bottom:16px}
.week-header h2{font-size:1.2rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.week-header .phase-badge{
  font-size:.68rem;padding:3px 10px;border-radius:12px;font-weight:700;
}
.bp1{background:rgba(96,165,250,.2);color:var(--blue)}
.bp2{background:rgba(167,139,250,.2);color:var(--purple)}
.bp3{background:rgba(244,114,182,.2);color:var(--pink)}
.bp4{background:rgba(45,212,191,.2);color:var(--teal)}
.week-header .desc{font-size:.82rem;color:var(--dim);margin-top:4px}

/* ===== DAY CARDS ===== */
.day-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  margin-bottom:10px;overflow:hidden;transition:all .2s;
}
.day-card:hover{border-color:#3a4a5e}
.day-card.done{border-color:rgba(74,222,128,.2);background:rgba(74,222,128,.03)}
.day-card.today{border-color:var(--orange);box-shadow:0 0 0 1px rgba(251,146,60,.25)}

.day-bar{
  padding:12px 16px;display:flex;align-items:center;gap:10px;
  cursor:pointer;user-select:none;
}
.day-num{
  font-size:.68rem;font-weight:700;padding:4px 8px;border-radius:8px;
  min-width:55px;text-align:center;
}
.dn1{background:rgba(96,165,250,.15);color:var(--blue)}
.dn2{background:rgba(167,139,250,.15);color:var(--purple)}
.dn3{background:rgba(244,114,182,.15);color:var(--pink)}
.dn4{background:rgba(45,212,191,.15);color:var(--teal)}
.day-info{flex:1}
.day-info h4{font-size:.9rem;font-weight:600}
.day-info .sub{font-size:.74rem;color:var(--dim)}
.day-meta{font-size:.74rem;color:var(--yell);white-space:nowrap}
.day-meta2{font-size:.7rem;color:var(--dim);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.expand-hint{font-size:.68rem;color:var(--dim);white-space:nowrap}

.day-check{
  width:32px;height:32px;min-width:32px;border-radius:50%;
  border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:.8rem;font-weight:700;
  color:transparent;background:transparent;
}
.day-check:hover{border-color:var(--green)}
.day-card.done .day-check{background:var(--green);border-color:var(--green);color:#000}

.day-body{padding:0 16px 14px 80px}
.day-body ul{list-style:none}
.day-body ul li{
  font-size:.8rem;color:var(--dim);padding:3px 0 3px 16px;position:relative;line-height:1.55;
}
.day-body ul li::before{content:'▸';position:absolute;left:0;color:var(--teal);font-size:.6rem;top:5px}
.day-body pre{
  background:#0a0e15;border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;margin:4px 0;overflow-x:auto;font-size:.72rem;line-height:1.5;
}
.day-body code{font-family:"Cascadia Code","Fira Code",monospace}
.day-body .c1{color:var(--teal)}
.day-body .c2{color:#6a9955}
.day-body .check-item{color:var(--green);font-weight:600;margin-top:6px;font-size:.8rem}
.day-body .warn-item{color:#f87171;font-size:.78rem;margin-top:4px}
.day-tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.day-tag{font-size:.64rem;padding:2px 7px;border-radius:6px;background:rgba(124,135,156,.1);color:var(--dim)}
.day-res{font-size:.74rem;color:var(--dim);margin-top:6px;padding:6px 10px;background:rgba(96,165,250,.05);border-radius:6px}
.day-res b{color:var(--blue)}

.day-notes{padding:0 16px 10px 80px}
.day-notes textarea{
  width:100%;background:#0a0e15;border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:8px 10px;font-size:.76rem;resize:vertical;
  min-height:34px;font-family:inherit;
}

/* Toast */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--card);
  color:var(--green);padding:12px 20px;border-radius:20px;font-weight:600;
  border:1px solid var(--green);box-shadow:0 6px 24px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px);transition:all .3s;z-index:999;
}
.toast.show{opacity:1;transform:translateY(0)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:640px){
  .header{padding:10px 12px}
  .day-body{padding:0 10px 10px 10px}
  .day-notes{padding:0 10px 10px 10px}
  .day-meta2{display:none}
  .expand-hint{display:none}
  .nav-row{padding:8px 10px;gap:6px}
  .wk-btn{width:38px;height:38px;font-size:.7rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>💊 AI制药 · 12周学习路线</span></div>

  <div class="roadmap" id="roadmap"></div>
</div>

<div class="nav-row" id="navRow"></div>

<div class="main" id="main"></div>

<div class="toast" id="toast"></div>

// ============================================================
// STATE
// ============================================================
const SK='ai-pharma-v5';
function ld(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return{};}}
function sv(p){localStorage.setItem(SK,JSON.stringify(p));}
let P=ld();

function allFlat(){
  const r=[];
  weeks.forEach(w=>w.days.forEach(d=>r.push({...d,wn:w.n})));
  return r;
}
const AF=allFlat(),TT=AF.length;

function getStats(){
  let dn=0;AF.forEach(d=>{if(P[d.wn+'-'+d.day]?.completed)dn++;});
  let st=0;const dt=new Date();
  for(let i=0;i<365;i++){
    const ds=dt.toISOString().split('T')[0];
    if(P[ds]?.completed){st++;dt.setDate(dt.getDate()-1);}
    else if(i===0){dt.setDate(dt.getDate()-1);const ys=dt.toISOString().split('T')[0];if(P[ys]?.completed){st++;dt.setDate(dt.getDate()-1);}else break;}
    else break;
  }
  return{dn,tt:TT,pct:Math.round(dn/TT*100),st};
}

function getTodayDay(){
  const st=new Date('2026-07-13'),nw=new Date();
  const df=Math.floor((nw-st)/86400000);
  if(df<0||df>=TT)return null;
  return AF[df];
}

let curWeek=1;

function renderAll(){
  renderHeader();renderRoadmap();renderNav();renderMain();
}

function renderHeader(){
  const s=getStats();
  document.getElementById('hdDone').textContent=s.dn;
  document.getElementById('hdTotal').textContent=s.tt;
  document.getElementById('hdPct').textContent=s.pct+'%';
  document.getElementById('hdStreak').textContent=s.st;
  document.getElementById('hdWeek').textContent='第'+curWeek+'周';
}

function renderRoadmap(){
  const phases=[
    {name:'阶段一<br>基础夯实',weeks:[1,2],cls:'ph1'},
    {name:'阶段二<br>ML+ADMET',weeks:[3,4],cls:'ph2'},
    {name:'阶段三<br>深度学习+GNN',weeks:[5,6,7,8],cls:'ph3'},
    {name:'阶段四<br>实战项目',weeks:[9,10,11,12],cls:'ph4'}
  ];
  const td=getTodayDay();
  const todayWn=td?td.wn:null;
  let h='';
  phases.forEach(ph=>{
    h+=`<div class="phase-col"><div class="phase-title ${ph.cls}">${ph.name}</div><div class="week-row">`;
    ph.weeks.forEach(wn=>{
      const w=weeks.find(x=>x.n===wn);if(!w)return;
      let wdn=0,wt=w.days.length;
      w.days.forEach(d=>{if(P[wn+'-'+d.day]?.completed)wdn++;});
      const allDone=wdn===wt&&wt>0;
      const isTodayWeek=(wn===todayWn);
      const isCurrent=(wn===curWeek);
      h+=`<div class="wk-btn${isCurrent?' current':''}${allDone?' done':''}" onclick="selectWeek(${wn})" title="第${wn}周：${w.t}&#10;${wdn}/${wt} 完成">${wn}<span class="tag">${isTodayWeek?'本周':''}</span></div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById('roadmap').innerHTML=h;
}

function renderNav(){
  const wk=weeks.find(w=>w.n===curWeek);
  const td=getTodayDay();
  const todayWn=td?td.wn:null;
  document.getElementById('navRow').innerHTML=`
    <button class="nav-btn" onclick="selectWeek(${curWeek-1})"${curWeek<=1?' disabled':''}>◀ 上一周</button>
    <span class="nav-info">📖 第 ${curWeek} 周</span>
    <button class="nav-btn" onclick="selectWeek(${curWeek+1})"${curWeek>=12?' disabled':''}>下一周 ▶</button>
    ${todayWn&&todayWn!==curWeek?`<button class="nav-btn today-btn" onclick="selectWeek(${todayWn})">📍 回到本周</button>`:''}
  `;
}

function renderMain(){
  const wk=weeks.find(w=>w.n===curWeek);if(!wk)return;
  let h=`<div class="week-header"><h2>第${curWeek}周：${wk.t}<span class="phase-badge ${wk.pc}">${wk.p}</span></h2><p class="desc">${wk.d||''}</p></div>`;
  const td=getTodayDay();
  wk.days.forEach(d=>{
    const did=curWeek+'-'+d.day,done=P[did]?.completed||false;
    const isToday=td&&td.wn===curWeek&&td.day===d.day;
    let dn='dn1';if(curWeek<=2)dn='dn1';else if(curWeek<=4)dn='dn2';else if(curWeek<=8)dn='dn3';else dn='dn4';
    h+=`<div class="day-card${done?' done':''}${isToday?' today':''}">
      <div class="day-bar" onclick="document.getElementById('db-${did}').classList.toggle('hidden')">
        <span class="day-num ${dn}">Day${d.day}</span>
        <div class="day-info"><h4>${d.title}${isToday?' <span style="color:var(--orange);font-size:.75rem;">📌今天</span>':''}</h4><div class="sub">🎯 ${d.goal||''}</div></div>
        <span class="day-meta">⏱️${d.time||'1.5h'}</span>
        <span class="day-meta2">${d.goal||''}</span>
        <span class="expand-hint">👆展开</span>
        <div class="day-check" onclick="event.stopPropagation();toggleDay('${did}');renderAll();" title="${done?'取消':'打卡'}">${done?'✓':''}</div>
      </div>
      <div class="day-body" id="db-${did}">
        ${d.steps&&d.steps.length?`<ul>${d.steps.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}
        ${d.check?`<div class="check-item">✅ ${d.check}</div>`:''}
        ${d.warn?`<div class="warn-item">⚠️ ${d.warn}</div>`:''}
        ${d.tags&&d.tags.length?`<div class="day-tags">${(Array.isArray(d.tags)?d.tags:[d.tags]).map(t=>`<span class="day-tag">${t}</span>`).join('')}</div>`:''}
        ${d.res?`<div class="day-res"><b>📚</b> ${d.res}</div>`:''}
      </div>
      <div class="day-notes"><textarea placeholder="📝 学习笔记（打卡后可写）" onchange="saveNote('${did}',this.value)">${P[did]?.notes||''}</textarea></div>
    </div>`;
  });
  document.getElementById('main').innerHTML=h;
}

function toggleDay(did){
  if(!P[did])P[did]={completed:false,notes:''};
  const was=P[did].completed;P[did].completed=!was;
  const td=new Date().toISOString().split('T')[0];
  if(!was){if(!P[td])P[td]={completed:false};P[td].completed=true;}
  sv(P);renderAll();
  showToast(was?'已取消':'✅ 打卡成功！继续加油！🔥');
}

function saveNote(did,val){if(!P[did])P[did]={completed:false,notes:''};P[did].notes=val;sv(P);}
function selectWeek(n){if(n<1||n>12)return;curWeek=n;renderAll();window.scrollTo({top:0,behavior:'smooth'});}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// CSS for hidden
const style=document.createElement('style');
style.textContent='.day-body.hidden{display:none}';
document.head.appendChild(style);

// Init
const td=getTodayDay();
if(td)curWeek=td.wn;
renderAll();
</script>
</body>
